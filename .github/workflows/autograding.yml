name: Pruebas del laboratorio

on:
  push:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Flex
        run: sudo apt-get update && sudo apt-get install -y flex
      - name: Compilar y correr las pruebas
        shell: bash
        run: make test
